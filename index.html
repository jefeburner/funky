    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: cyan;
            color: black;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        .top-title {
            text-align: center;
            padding-top: 20px;
        }

        .container {
            text-align: center;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .message {
            font-size: 24px;
            font-weight: bold;
        }

        .site-title {
            font-size: 48px;
            font-weight: normal;
            color: black;
            margin-bottom: 30px;
        }

        .continue-btn {
            font-size: 16px;
            padding: 15px 50px;
            margin-top: 20px;
            background-color: yellow;
            color: black;
            border: 2px solid black;
        }

        .fullscreen-gif {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s ease-in;
        }

        .fullscreen-gif.active {
            opacity: 1;
            pointer-events: auto;
        }

        .fullscreen-gif img {
            height: 100vh;
            width: auto;
            object-fit: contain;
        }

        .container.hidden {
            display: none;
        }

        .top-title.hidden {
            display: none;
        }

        .random-ju {
            position: fixed;
            height: 40vh;
            width: auto;
            display: none;
            pointer-events: none;
            z-index: 1000;
        }

        .random-ju.show {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .message {
                font-size: 1.8rem;
                margin-bottom: 40px;
            }

            .continue-btn {
                font-size: 1rem;
                padding: 15px 45px;
            }
        }

        @media (max-width: 480px) {
            .message {
                font-size: 1.5rem;
            }

            .continue-btn {
                font-size: 0.9rem;
                padding: 12px 35px;
                letter-spacing: 1.5px;
            }
        }
    </style>
</head>
<body>
    <div class="top-title">
        <h1 class="site-title">Arthurhogarth.com</h1>
    </div>

    <div class="container">
        <p class="message">Turn volume up</p>
        <button class="continue-btn" id="continueBtn">Enter</button>
    </div>

    <div class="fullscreen-gif" id="arthurGif">
        <img src="arthur.GIF" alt="Arthur Hogarth">
    </div>

    <img src="ju.GIF" alt="Ju" class="random-ju" id="randomJu">

    <audio id="funkytownAudio" loop preload="auto">
        <source src="funkytown.m4a" type="audio/mp4">
        <source src="funkytown.mp3" type="audio/mpeg">
    </audio>

    <script>
        let juInterval;

        window.addEventListener('load', function() {
            const funkytownAudio = document.getElementById('funkytownAudio');
            funkytownAudio.load();
        });

        document.getElementById('continueBtn').addEventListener('click', function() {
            document.querySelector('.container').classList.add('hidden');
            document.querySelector('.top-title').classList.add('hidden');

            const audio = document.getElementById('funkytownAudio');
            audio.play().catch(e => console.log('Audio play failed:', e));

            const arthurGif = document.getElementById('arthurGif');
            setTimeout(() => {
                arthurGif.classList.add('active');
            }, 10);

            startJuSequence();
        });

        function startJuSequence() {
            setTimeout(() => {
                showRandomJu();
                juInterval = setInterval(() => {
                    showRandomJu();
                }, 12000);
            }, 8000);
        }

        function showRandomJu() {
            const juElement = document.getElementById('randomJu');
            const viewportHeight = window.innerHeight;
            const viewportWidth = window.innerWidth;
            const juHeight = viewportHeight * 0.4;
            const estimatedJuWidth = juHeight * 1.5;
            const maxTop = viewportHeight - juHeight;
            const maxLeft = viewportWidth - estimatedJuWidth;
            const randomTop = Math.random() * Math.max(0, maxTop);
            const randomLeft = Math.random() * Math.max(0, maxLeft);

            juElement.style.top = randomTop + 'px';
            juElement.style.left = randomLeft + 'px';

            const currentSrc = juElement.src;
            juElement.src = '';
            juElement.src = currentSrc;

            juElement.classList.add('show');

            setTimeout(() => {
                juElement.classList.remove('show');
            }, 4000);
        }
    </script>
</body>
</html>
